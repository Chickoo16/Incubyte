<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" role="img" aria-label="Container diagram of the salary management system: the HR Manager's browser runs an Angular SPA that talks to Nginx, which serves static assets and reverse-proxies API calls to a Spring Boot service whose controller, service and repository layers read and write a SQLite file on a mounted Docker volume; a one-time seed script populates the same database at startup. Nginx, Spring Boot and the SQLite volume all run inside a single Docker Compose stack.">
  <title>Salary Management — Container Architecture</title>
  <defs>
    <marker id="arrowLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="730" fill="#ffffff"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Docker Compose boundary -->
    <rect x="30" y="222" width="820" height="484" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="44" y="243" font-size="11.5" font-weight="700" fill="#475569">Docker Compose</text>
    <text x="440" y="692" font-size="10.5" fill="#475569" text-anchor="middle">one "docker compose up" · runs entirely locally · no external cloud dependency</text>

    <!-- HR Manager -->
    <rect x="170" y="20" width="190" height="48" rx="24" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="41" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">HR Manager</text>
    <text x="265" y="57" font-size="10.5" fill="#475569" text-anchor="middle">single internal user</text>

    <line x1="265" y1="68" x2="265" y2="100" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowLive)"/>
    <text x="276" y="90" font-size="10" fill="#0369a1">opens in browser</text>

    <!-- Angular SPA -->
    <rect x="90" y="104" width="350" height="78" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="129" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Angular SPA · Angular Material</text>
    <text x="265" y="149" font-size="10.5" fill="#475569" text-anchor="middle">Employee Directory · Employee Detail</text>
    <text x="265" y="166" font-size="10.5" fill="#475569" text-anchor="middle">Add / Edit Employee · Analytics Dashboard</text>

    <!-- Browser to Nginx: two request paths -->
    <line x1="190" y1="182" x2="190" y2="244" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowLive)"/>
    <text x="183" y="206" font-size="10" fill="#0369a1" text-anchor="end">GET / — static assets</text>
    <line x1="340" y1="182" x2="340" y2="244" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowLive)"/>
    <text x="348" y="206" font-size="10" fill="#0369a1">GET /api/* — JSON</text>

    <!-- Nginx -->
    <rect x="90" y="248" width="350" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="273" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Nginx :80</text>
    <text x="265" y="293" font-size="10.5" fill="#475569" text-anchor="middle">serves Angular build · reverse-proxies /api/*</text>

    <line x1="265" y1="312" x2="265" y2="348" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowLive)"/>
    <text x="276" y="335" font-size="10" fill="#0369a1">proxy_pass → api:8080</text>

    <!-- Spring Boot -->
    <rect x="90" y="352" width="350" height="226" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="376" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Spring Boot 3 · Java 17</text>

    <rect x="110" y="388" width="310" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="265" y="408" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Controller layer</text>
    <text x="265" y="425" font-size="10.5" fill="#475569" text-anchor="middle">Employee · Salary · Analytics endpoints</text>

    <line x1="265" y1="434" x2="265" y2="450" stroke="#475569" stroke-width="1.3" marker-end="url(#arrowMuted)"/>

    <rect x="110" y="452" width="310" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="265" y="472" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Service layer</text>
    <text x="265" y="489" font-size="10.5" fill="#475569" text-anchor="middle">gross / net computation · aggregations</text>

    <line x1="265" y1="498" x2="265" y2="514" stroke="#475569" stroke-width="1.3" marker-end="url(#arrowMuted)"/>

    <rect x="110" y="516" width="310" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="265" y="536" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Repository layer</text>
    <text x="265" y="553" font-size="10.5" fill="#475569" text-anchor="middle">Spring Data JPA</text>

    <line x1="265" y1="578" x2="265" y2="614" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowLive)"/>
    <text x="276" y="601" font-size="10" fill="#0369a1">JDBC</text>

    <!-- SQLite -->
    <rect x="90" y="618" width="350" height="54" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="265" y="640" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">SQLite · salary.db</text>
    <text x="265" y="658" font-size="10.5" fill="#475569" text-anchor="middle">mounted Docker volume — survives restarts</text>

    <!-- Seed script -->
    <rect x="540" y="396" width="280" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="680" y="421" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Seed script</text>
    <text x="680" y="440" font-size="10.5" fill="#475569" text-anchor="middle">CommandLineRunner in the API container</text>
    <text x="680" y="457" font-size="10.5" fill="#475569" text-anchor="middle">10,000 employees · first run only</text>

    <path d="M 680 470 L 680 645 L 444 645" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowMuted)"/>
    <text x="692" y="524" font-size="10" fill="#475569">JDBC bulk insert</text>
    <text x="692" y="540" font-size="10" fill="#475569">one-time, at startup</text>

  </g>
</svg>
