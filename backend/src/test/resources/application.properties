spring.application.name=salary-management

# Shared-cache in-memory SQLite: every pooled connection in the JVM sees the
# same database, unlike plain ":memory:" which gives each connection its own.
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
