spring.application.name=salary-management

spring.datasource.url=jdbc:sqlite:${SALARY_DB_PATH:./data/salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows only one writer at a time; a single pooled connection avoids
# "database is locked" errors instead of masking them with retries.
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
